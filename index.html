<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<!-- Only this site's own files run here. Pictures come from Discogs, fonts from Google Fonts,
     and the app talks only to the Google Sheet's web address. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://i.discogs.com https://img.discogs.com; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<title>Jukebox Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Limelight&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <aside class="rail">
    <div class="brand">
      <span class="brand-name">Jukebox Catalog</span>
      <span class="brand-sub">Rowe AMI CD jukebox</span>
    </div>
    <nav class="nav" aria-label="Sections">
      <button class="nav-btn" data-view="find" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
        <span>Find music</span>
      </button>
      <button class="nav-btn" data-view="jukebox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.6"/><path d="M12 5.5a6.5 6.5 0 0 1 6.5 6.5" stroke-linecap="round"/></svg>
        <span>In the jukebox</span>
      </button>
      <button class="nav-btn" data-view="manage" id="navManage"></button>
    </nav>
    <div class="rail-foot">
      <div class="rail-stats" id="railStats"></div>
      <button class="rest-btn" data-go-idle title="Done: show the idle screen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
        <span>Done</span>
      </button>
    </div>
  </aside>

  <main class="main" id="main">
    <p class="proto-note" id="demoNote" hidden>Demo with sample albums. Nothing here is connected to the Sheet or Discogs.</p>

    <section class="view" id="view-find" aria-labelledby="findTitle">
      <h1 class="sr-only" id="findTitle">Find music</h1>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
        <label for="q" class="sr-only">Search the collection</label>
        <input id="q" type="search" placeholder="Search an artist, album, or song" autocomplete="off" spellcheck="false">
        <button class="btn-quiet" id="qClear" hidden>Clear</button>
      </div>
      <div class="filters" id="filters"></div>
      <div class="results" id="results"></div>
    </section>

    <section class="view" id="view-jukebox" hidden></section>
    <section class="view" id="view-manage" hidden></section>
  </main>
</div>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="scrim" data-close-sheet></div>
  <article class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-bar"><button class="btn btn-secondary" data-close-sheet id="sheetClose">Close</button></div>
    <div class="sheet-body" id="sheetBody"></div>
  </article>
</div>

<div class="sheet-wrap help-wrap" id="helpWrap" hidden>
  <div class="scrim" data-help-close></div>
  <article class="sheet" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
    <div class="sheet-bar"><button class="btn btn-secondary" data-help-close id="helpClose">Close</button></div>
    <div class="sheet-body" id="helpBody"></div>
  </article>
</div>

<button class="help-fab" id="helpFab" data-help-open aria-label="How to" title="How to">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.6"/><circle cx="12" cy="16.9" r=".6" fill="currentColor"/></svg>
</button>

<div class="idle" id="idle" hidden>
  <h2>Now in the Jukebox</h2>
  <div class="idle-rows" id="idleRows"></div>
  <p>Touch anywhere to find a song</p>
</div>

<div class="sheet-wrap ask-wrap" id="askWrap" hidden>
  <div class="scrim"></div>
  <div class="ask" role="alertdialog" aria-modal="true" aria-labelledby="askText">
    <p id="askText"></p>
    <div class="frow"><button class="btn btn-primary" id="askYes"></button><button class="btn btn-secondary" id="askNo"></button></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div id="printArea" aria-hidden="true"></div>

<script src="config.js"></script>
<script src="sample-data.js"></script>
<script src="app.js"></script>
</body>
</html>
